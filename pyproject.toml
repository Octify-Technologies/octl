[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "octl"
version = "1.3.0"
description = "Octify dev workflow CLI"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "questionary>=2.0",
]

[project.scripts]
octl = "cli:main"
syncenv = "cli:syncenv_cmd"
clean-branches = "cli:clean_branches_cmd"
